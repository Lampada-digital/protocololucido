<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE LUCID PROTOCOL</title>
  <meta name="description" content="Somnus Dynamics - Protocol 12 - Interval 01: Disconnection" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; background: #000; overflow: hidden; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <!-- Minimalist Crosshair -->
    <div id="crosshair"></div>
    
    <!-- Film grain -->
    <div id="film-grain"></div>
    
    <!-- Start Screen (Somnus Terminal) -->
    <div id="start-screen">
      <div class="terminal-content">
        <div class="terminal-header">
          <div class="somnus-logo">◈ SOMNUS DYNAMICS</div>
          <div class="terminal-id">NEURAL INTERFACE DIVISION // TERMINAL 034</div>
        </div>
        
        <div class="terminal-body">
          <div class="terminal-line">> LUCID SYSTEM v4.7.2</div>
          <div class="terminal-line">> PROTOCOL 12 ACTIVE</div>
          <div class="terminal-line">> SUBJECT: DANIEL VALE // 034</div>
          <div class="terminal-line">> INTERVAL: 01 — DISCONNECTION</div>
          <div class="terminal-line warning">> WARNING: COGNITIVE INSTABILITY DETECTED</div>
          <div class="terminal-line">> NRL: <span id="nrl-display">12%</span></div>
          <div class="terminal-line">> STATUS: <span class="status-active">RECONSTRUCTING MEMORY</span></div>
        </div>
        
        <div class="terminal-footer">
          <button id="start-button">INITIATE SESSION</button>
          <div class="terminal-note">Press any key to continue</div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
