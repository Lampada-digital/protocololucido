<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O Protocolo Lúcido</title>
  <meta name="description" content="A multiplayer psychological horror FPS. Enter the shared unconscious." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="react-root"></div>
    <div id="crosshair"></div>
    <div id="start-screen">
      <div class="start-content">
        <h1 class="glitch-text" data-text="O PROTOCOLO LÚCIDO">O PROTOCOLO LÚCIDO</h1>
        <p class="subtitle">Enter the shared unconscious</p>
        <button id="start-button">BEGIN DIVE</button>
        <div class="controls-info">
          <p>WASD - Move | MOUSE - Look | SHIFT - Sprint | CTRL - Crouch</p>
          <p>LEFT CLICK - Shoot | M - Toggle Mic | ESC - Menu</p>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
