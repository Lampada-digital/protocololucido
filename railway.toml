[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "lucid-server"
protocol = "tcp"
internalPort = 2567

  [[services.healthChecks]]
  path = "/health"
  initialDelaySeconds = 5
  gracePeriodSeconds = 10
  intervalSeconds = 30
  timeoutSeconds = 3
